# Source catalogue (machine-readable source of truth).
#
# Laws, frameworks and guidance that may contain minimum requirements for
# suppliers or data storage. Teams reference these ids from their rules, so
# every requirement a tool produces can be traced back to a source.
#
# origin:
#   icbr-werksessie : first-pass source list from the VNG "Uitvoeringsstrategie Cloud"
#                     work session that the classification model comes from
#   challenge-brief : additional resources listed in the OneGov #3 challenge brief
#
# url: null means the canonical public link is not known yet (challenge owners to supply).
# Pull requests that add verified links are welcome.

sources:
  # Dutch law
  - id: avg
    name: Algemene verordening gegevensbescherming (AVG / GDPR)
    category: nl-law
    origin: icbr-werksessie
    url: https://eur-lex.europa.eu/eli/reg/2016/679/oj
  - id: woo
    name: Wet open overheid (Woo)
    category: nl-law
    origin: icbr-werksessie
    url: https://wetten.overheid.nl/BWBR0045754
  - id: archiefwet
    name: Archiefwet
    category: nl-law
    origin: icbr-werksessie
    url: https://zoek.officielebekendmakingen.nl/stb-2026-149.html
    notes: "Archiefwet 2026 (Staatsblad 2026, 149) replaces the Archiefwet 1995 (https://wetten.overheid.nl/BWBR0007376). Check which one applies on the date of your case."
  - id: wwke
    name: "Wet weerbaarheid kritieke entiteiten (Wwke, Dutch implementation of the EU CER directive)"
    category: nl-law
    origin: icbr-werksessie
    url: https://zoek.officielebekendmakingen.nl/kst-36765-3.html
    notes: "In force since 15 August 2026, together with the Cbw. Link: explanatory memorandum\
  \ (Kamerstuk 36 765, nr. 3)."
  - id: cbw
    name: "Cyberbeveiligingswet (Cbw, Dutch implementation of NIS2)"
    category: nl-law
    origin: icbr-werksessie
    url: https://www.eerstekamer.nl/wetsvoorstel/36764_cyberbeveiligingswet
    notes: In force since 15 August 2026. For the government sector the duty of care is filled in with BIO2.

  # EU law and frameworks
  - id: data-act
    name: Data Act (EU)
    category: eu-law
    origin: icbr-werksessie
    url: https://eur-lex.europa.eu/eli/reg/2023/2854/oj
  - id: ai-act
    name: AI Act (EU)
    category: eu-law
    origin: icbr-werksessie
    url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
  - id: dora
    name: Digital Operational Resilience Act (DORA)
    category: eu-law
    origin: icbr-werksessie
    url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
  - id: cra
    name: Cyber Resilience Act (EU)
    category: eu-law
    origin: icbr-werksessie
    url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
  - id: ecsf
    name: European Cloud Sovereignty Framework (SEAL levels)
    category: eu-framework
    origin: icbr-werksessie
    url: https://commission.europa.eu/document/download/09579818-64a6-4dd5-9577-446ab6219113_en?filename=Cloud-Sovereignty-Framework.pdf
    notes: Eight sovereignty objectives (SOV-1 to SOV-8) and assurance levels SEAL-0 to SEAL-4. See docs/sovereignty-levels.md.
  - id: cada
    name: "Cloud and AI Development Act (CADA, EU proposal)"
    category: eu-law
    origin: icbr-werksessie
    url: https://digital-strategy.ec.europa.eu/en/library/proposal-cloud-and-ai-development-act-cada
    notes: "Proposal COM(2026) 502 of 3 June 2026, still in the legislative procedure. Proposes sovereignty levels for cloud services."

