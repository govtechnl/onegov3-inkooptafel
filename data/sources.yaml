# Source catalogue (machine-readable source of truth).
#
# Laws, frameworks and guidance that may contain minimum requirements for
# suppliers or data storage. Teams reference these ids from their rules, so
# every requirement a tool produces can be traced back to a source.
#
# origin:
#   icbr-werksessie : first-pass source list from the VNG "Uitvoeringsstrategie Cloud"
#                     work session that the classification model comes from
#   challenge-brief : additional resources listed in the OneGov #3 challenge brief
#
# url: null means the challenge owners still have to supply the canonical link.
# Pull requests that add verified links are welcome.

