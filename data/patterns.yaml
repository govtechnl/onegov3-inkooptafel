# Starter file: in your team fork, fill in per pattern
#   sovereignty_level  your advised level (for example SEAL-0 .. SEAL-4, see docs/sovereignty-levels.md)
#   rationale          why this level, in one or two sentences
#   requirements       requirements or award criteria for the programme of requirements (PvE)
#
# Every requirement points to a source id from data/sources.yaml.
# Example requirement:
#   - id: P01-R1
#     type: eis                 # eis (requirement) | gunningscriterium (award criterion)
#     text: "De opdrachtnemer ..."
#     source: avg

