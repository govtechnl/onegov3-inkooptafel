name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install starter tooling
        working-directory: tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        working-directory: tooling
        run: ruff check .

      - name: Validate catalogues and run tests
        working-directory: tooling
        run: pytest -v

      - name: Smoke-test the CLI
        working-directory: tooling
        run: |
          python -m inkooptafel.toets examples/assessment-example.yaml
          python -m inkooptafel.advies examples/assessment-example.yaml --rules examples/example-rules.yaml
